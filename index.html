<!-- Cobre o vão entre o app abrir e App.boot() decidir Login/Início/
     Ativação (ensureActivated faz uma chamada de rede antes disso) --
     sem isso ficava tudo preto, sem feedback nenhum, até a 1ª tela
     ativar (bug real reportado: "saí e entrei de novo, ficou tudo preto,
     não aparece aquela parte de carregando igual o Android" -- lá o
     VerifyingScreen.kt cobre esse mesmo vão). Visível por padrão (HTML
     puro, antes de qualquer JS rodar); App.boot() some com ele assim que
     a 1ª tela de verdade ativa (ver Router.go). -->
<div id="boot-loading">
  <div class="boot-logo">U</div>
  <div class="boot-title">UKANOTV</div>
  <div class="boot-spinner"></div>
  <div class="boot-text">Verificando sua sessão…</div>
</div>
